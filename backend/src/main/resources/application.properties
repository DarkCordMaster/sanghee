spring.application.name=sanghee-backend
server.port=8080

# H2를 파일 모드로 써서 서버를 껐다 켜도 대화 기록이 남게 함(메모리 모드는 재시작하면 날아감).
# 로컬 1인 프로젝트라 별도 DB 서버 설치 없이 바로 돌아가는 걸 우선함.
spring.datasource.url=jdbc:h2:file:./data/sanghee;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

mybatis.configuration.map-underscore-to-camel-case=true

# 상희 캐릭터 정의(성격/말투)를 코드가 아니라 JSON 파일로 분리해서,
# 캐릭터 설정 바꿀 때 자바 코드를 안 건드려도 되게 함
sanghee.character.path=classpath:characters/sanghee.json

# 로컬 Ollama 서버 연동 설정. qwen3:8b는 이미 pull되어 있는 모델.
sanghee.ollama.base-url=http://localhost:11434
sanghee.ollama.model=qwen3:8b
