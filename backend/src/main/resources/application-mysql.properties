# MySQL로 전환할 때 쓰는 프로필. 기본으로는 켜지지 않고, 실행할 때
# --spring.profiles.active=mysql (또는 SPRING_PROFILES_ACTIVE=mysql) 로 명시해야 적용됨.
#
# 사전 준비만 해둔 상태 — 실제로 쓰려면:
#   1) MySQL을 설치하고 서버를 띄운다
#   2) sanghee 데이터베이스를 만든다: CREATE DATABASE sanghee CHARACTER SET utf8mb4;
#   3) 아래 URL/계정 정보를 실제 값으로 맞추거나, DB_USERNAME/DB_PASSWORD 환경변수로 넘긴다
#   4) ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql 로 실행한다

spring.datasource.url=jdbc:mysql://localhost:3306/sanghee?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.platform=mysql

# MySQL은 별도 서버라 H2 콘솔이 필요 없음
spring.h2.console.enabled=false
